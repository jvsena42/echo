name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Kotlin lint (detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detektAll

      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

  test-build:
    name: Unit tests + Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest

      - name: Assemble Android debug
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  cli-linux:
    # The row that matters most for #54: a headless Linux x86_64 box with no desktop session and
    # no libsecret, which is exactly what a GitHub runner is. Verified here rather than assumed —
    # the 1,271 shared tests run against a fake client and would pass on a machine where
    # `linux-x86-64/libpubkycore.so` is missing or the wrong architecture, and that failure only
    # shows up at the first homeserver call as an ordinary-looking transport error.
    name: CLI on Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs the whole shared suite on the jvm() target, including the FFI smoke test that loads
      # the real .so and derives a keypair through it.
      - name: Shared tests on the JVM target
        run: ./gradlew :shared:jvmTest :cli:test

      - name: Build the distribution
        run: ./gradlew :cli:installDist

      # The contract an agent branches on, asserted on the actual binary rather than in a unit
      # test: distinguishable exit codes, and a parseable failure envelope on stdout. Deliberately
      # offline — nothing here needs a homeserver, so a network blip cannot make it flake.
      - name: Smoke-test the binary
        env:
          LOOPKY_CONFIG_HOME: ${{ runner.temp }}/loopky-ci
          # The ambient update check is off for the assertions below, so a green PR never depends
          # on github.com answering (#209). `update --check` further down is the one step that is
          # allowed to reach the network, and it exits 0 whether or not it can.
          LOOPKY_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          BIN=cli/build/install/loopky/bin/loopky

          "$BIN" --version
          "$BIN" --help > /dev/null

          # No session anywhere: exit 3, and the JSON says so in words as well as a number.
          set +e
          OUT=$("$BIN" whoami --json)
          CODE=$?
          set -e
          echo "$OUT"
          test "$CODE" -eq 3
          echo "$OUT" | grep -q '"code":"not_signed_in"'
          echo "$OUT" | grep -q '"schema":1'
          # Every result names the network it ran against, so an empty answer can never be
          # mistaken for an answer from the wrong one.
          echo "$OUT" | grep -q '"environment":"production"'

          # `update_available` is on every envelope, and null when there is nothing to say — which
          # is what makes a caller that ignores it stay correct, and what made adding it legal
          # under `schema: 1` (#209).
          echo "$OUT" | grep -q '"update_available":null'

          # An unknown command is a usage error, not a crash and not a silent success.
          set +e
          "$BIN" frobnicate --json > /dev/null
          CODE=$?
          set -e
          test "$CODE" -eq 2

          # A bad input file is its own code, distinct from both of the above.
          set +e
          "$BIN" import /no/such/file.tsv --title T --json > /dev/null
          CODE=$?
          set -e
          test "$CODE" -eq 3   # not signed in is checked first, before the file is read

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  cli-binary:
    # The packaging, checked on every change rather than at a tag (#210). Everything above this
    # job passes on a build that needs a JRE 17 installed, which is the thing the binary exists to
    # remove — so a regression here is invisible to all of it.
    #
    # Two properties, both of which have already broken once and neither of which a green
    # `assembleDebug` says anything about:
    #
    #  - **it is one file.** `native-image` does not fail when it cannot fold a JDK native library
    #    into the executable; it emits the library beside it and reports success. Reaching
    #    `javax.imageio` from anywhere adds three `libawt*.so`, and `curl … -o ~/.local/bin/loopky`
    #    quietly stops being an install. The guard that *enforces* this is
    #    `:cli:checkNativeImageIsOneFile` inside the builder, which fails the `docker build`; the
    #    `export` stage copies the whole output directory so the count below is a real assertion
    #    rather than a tautology about a stage that copies one named file.
    #  - **it runs.** JNA extracts `libpubkycore` from the image's own resources through a code
    #    path a closed-world binary has to be told about by hand, and a missing registration is a
    #    runtime failure with a green build behind it.
    #
    # Built through `cli/Dockerfile` rather than on the runner, so this is the same recipe the
    # release uses and there is no second one to drift.
    name: CLI as a native binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the binary
        run: docker build -f cli/Dockerfile --target export --output type=local,dest=dist .

      - name: One file, and it works
        env:
          LOOPKY_CONFIG_HOME: ${{ runner.temp }}/loopky-native
          LOOPKY_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          ls -la dist
          test "$(ls dist | wc -l)" -eq 1
          chmod +x dist/loopky

          dist/loopky --version
          dist/loopky --help > /dev/null

          # Same assertions as the jar's smoke test, on the artifact people actually install.
          set +e; OUT=$(dist/loopky whoami --json); CODE=$?; set -e
          echo "$OUT"
          test "$CODE" -eq 3
          echo "$OUT" | grep -q '"code":"not_signed_in"'
          echo "$OUT" | grep -q '"schema":1'
          echo "$OUT" | grep -q '"environment":"production"'

          echo "$OUT" | grep -q '"update_available":null'

          set +e; dist/loopky frobnicate --json > /dev/null; CODE=$?; set -e
          test "$CODE" -eq 2

          # `update --check` on the artifact people actually install (#209). Two properties, and
          # the second is why this is here rather than in a unit test: it needs no session, and a
          # release page it cannot reach — no egress, a proxy, a tag with no manifest on it yet —
          # is reported and exits **0**. A self-updater that fails the shell it is called from
          # because GitHub was slow is worse than one that never checks.
          dist/loopky update --check --json | tee update.json
          grep -q '"command":"update"' update.json
          grep -q '"install":' update.json

          # The FFI, which is the whole of the difficulty and the one thing a JVM run cannot
          # vouch for: this reaches `_UniFFILib.INSTANCE`, so it loads `libpubkycore` out of the
          # binary's own resources, checks its API checksums and registers a JNA callback. A
          # missing reachability registration dies here and nowhere earlier.
          #
          # It then blocks on a human approving in Ring, so it is killed after a moment — the URL
          # *is* the pass. Offline-safe on purpose: the URL is built locally from a generated
          # secret and printed before the relay is polled, so this asserts the FFI and nothing
          # about the network, and a relay wobble cannot fail a PR.
          timeout -s TERM 25 dist/loopky login --url-only > /dev/null 2> qr.log || true
          cat qr.log
          grep -q '^pubkyauth://' qr.log

          # And the SDK's tracing stays quiet by default. There is no start script on a binary to
          # export RUST_LOG, so this is `RustLog.kt` doing it through libc — verified here because
          # the failure is four ANSI-coloured lines on the channel an agent captures.
          test "$(grep -c 'DEBUG\|INFO' qr.log || true)" -eq 0

          # SQLite, which is JNA's problem all over again in a second library (#211). `.apkg`
          # import opens its collection through the JDBC driver, which extracts a native library
          # from the image's own resources — reflective loading, the one thing a closed-world
          # binary has to be told about by hand. Nothing else the CLI does touches `org.sqlite`,
          # so without this the first Anki import on a user's machine is the first time anyone
          # finds out. `--dry-run` needs no session and no network, so it cannot flake.
          python3 cli/tools/make-sample-apkg.py sample.apkg
          dist/loopky import sample.apkg --dry-run --json | tee apkg.json
          # Three notes in, three cards out, and the front is field **2** — the deck's first
          # column is database ids, which is the failure the headless field picker exists for.
          grep -q '"cards":3' apkg.json
          grep -q '"front_index":2' apkg.json
          grep -q '"format":"apkg"' apkg.json
